<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetroSmart — Accounts Management</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary": "#ffffff",
              "on-tertiary-container": "#2d8db3",
              "on-primary-fixed-variant": "#3f465c",
              "tertiary-fixed-dim": "#7bd1fa",
              "on-primary": "#ffffff",
              "primary": "#000000",
              "inverse-primary": "#bec6e0",
              "on-primary-container": "#7c839b",
              "surface": "#f8f9ff",
              "on-surface-variant": "#45464d",
              "surface-tint": "#565e74",
              "error": "#ba1a1a",
              "on-surface": "#0b1c30",
              "surface-bright": "#f8f9ff",
              "on-error-container": "#93000a",
              "outline": "#76777d",
              "inverse-on-surface": "#eaf1ff",
              "primary-fixed": "#dae2fd",
              "tertiary": "#000000",
              "tertiary-container": "#001e2b",
              "inverse-surface": "#213145",
              "on-secondary-fixed": "#00174b",
              "surface-container-low": "#eff4ff",
              "on-tertiary-fixed-variant": "#004d66",
              "on-secondary-container": "#fefcff",
              "tertiary-fixed": "#c0e8ff",
              "primary-fixed-dim": "#bec6e0",
              "on-secondary": "#ffffff",
              "surface-container-high": "#dce9ff",
              "secondary-container": "#316bf3",
              "secondary-fixed-dim": "#b4c5ff",
              "on-error": "#ffffff",
              "on-background": "#0b1c30",
              "surface-container-highest": "#d3e4fe",
              "background": "#f8f9ff",
              "outline-variant": "#c6c6cd",
              "secondary-fixed": "#dbe1ff",
              "surface-container-lowest": "#ffffff",
              "primary-container": "#131b2e",
              "on-tertiary-fixed": "#001e2b",
              "secondary": "#0051d5",
              "on-secondary-fixed-variant": "#003ea8",
              "on-primary-fixed": "#131b2e",
              "surface-container": "#e5eeff",
              "surface-dim": "#cbdbf5",
              "surface-variant": "#d3e4fe",
              "error-container": "#ffdad6"
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            spacing: {
              "container-margin": "24px", "stack-lg": "24px", "gutter": "16px",
              "sidebar-width": "260px", "stack-sm": "8px", "stack-md": "16px"
            },
            fontFamily: {
              "headline-lg-mobile": ["Manrope"], "headline-md": ["Manrope"],
              "body-sm": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Manrope"],
              "headline-sm": ["Manrope"], "label-md": ["Inter"], "body-lg": ["Inter"]
            },
            fontSize: {
              "headline-lg-mobile": ["24px", { lineHeight: "30px", fontWeight: "700" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "body-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-lg": ["30px", { lineHeight: "38px", fontWeight: "700" }],
              "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }],
              "label-md": ["13px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }]
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
